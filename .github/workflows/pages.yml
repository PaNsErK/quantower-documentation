name: Validate and deploy documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out public documentation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
          cache: ""
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Validate source and tests
        run: |
          python tools/validate_public_docs.py source
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build online and offline sites
        run: |
          python -m mkdocs build --strict
          python -m mkdocs build --strict -f mkdocs.offline.yml
          python tools/validate_public_docs.py generated --site-root site --offline-root site-offline
      - name: Upload generated site only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy immutable build artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
